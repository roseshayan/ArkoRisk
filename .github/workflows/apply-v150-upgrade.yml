name: Apply ArkoRisk v1.50 upgrade

on:
  push:
    branches:
      - feature/mt5-runtime-controls-smart-be
    paths:
      - tools/upgrade_arkorisk_v150.py
      - .github/workflows/apply-v150-upgrade.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/upgrade_arkorisk_v150.py
      - .github/workflows/apply-v150-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', 'generated: apply ArkoRisk v1.50 MT5 upgrade') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mt5-runtime-controls-smart-be
          fetch-depth: 0

      - name: Apply source upgrade
        run: python3 tools/upgrade_arkorisk_v150.py

      - name: Validate generated source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '#property version   "1.50"' MQL5/Experts/ArkoRisk/ArkoRisk.mq5
          grep -q 'SmartBreakEvenOffset' MQL5/Experts/ArkoRisk/ArkoRisk.mq5
          grep -q 'RP_TAB_JOURNAL' MQL5/Experts/ArkoRisk/ArkoRisk.mq5
          grep -q 'DrawTehranDayMarkers' MQL5/Experts/ArkoRisk/ArkoRisk.mq5
          grep -q 'g_manage_manual_positions' MQL5/Experts/ArkoRisk/ArkoRisk.mq5
          python3 - <<'PY'
          from pathlib import Path
          s=Path('MQL5/Experts/ArkoRisk/ArkoRisk.mq5').read_text(encoding='utf-8')
          assert s.count('{') == s.count('}'), (s.count('{'), s.count('}'))
          assert 'if(InpUseBreakEven &&' not in s
          assert 'if(InpUsePartialClose &&' not in s
          assert 'if(InpUseTrailing &&' not in s
          print('basic structural checks passed')
          PY

      - name: Commit generated EA
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- MQL5/Experts/ArkoRisk/ArkoRisk.mq5; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MQL5/Experts/ArkoRisk/ArkoRisk.mq5
          git commit -m 'generated: apply ArkoRisk v1.50 MT5 upgrade'
          git push origin HEAD:feature/mt5-runtime-controls-smart-be
